<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>eHMI Study · Results (team only)</title>
<style>
  body { margin: 0; padding: 24px; background: #0b0e16; color: #e8ecf5;
    font-family: system-ui, -apple-system, sans-serif; font-size: 14px; }
  h1 { font-size: 18px; }
  input, button { background: #1b2438; color: #e8ecf5; border: 1px solid rgba(120,160,220,0.35);
    border-radius: 6px; padding: 7px 10px; font-size: 13px; }
  button { cursor: pointer; }
  button:hover { background: #263351; }
  #list { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; max-width: 560px; }
  .rowi { display: flex; gap: 8px; align-items: center; justify-content: space-between;
    background: rgba(20,26,42,0.8); border: 1px solid rgba(120,160,220,0.2);
    border-radius: 8px; padding: 8px 12px; }
  .muted { color: #8a96ad; font-size: 12.5px; }
</style>
</head>
<body>
  <h1>eHMI Study · collected results</h1>
  <p class="muted">Team page, not linked anywhere participant facing. Enter the
  RESULTS_KEY (set in the Netlify environment variables) to load the stored
  sessions. Works only on the deployed site, not on localhost.</p>
  <div>
    <input id="key" type="password" placeholder="RESULTS_KEY" size="30" />
    <button id="load">Load sessions</button>
    <button id="all">⬇ Download everything (merged JSON)</button>
  </div>
  <div id="list"></div>
<script>
  const $ = (id) => document.getElementById(id);
  const api = (params) => fetch('/api/results?' + new URLSearchParams({ key: $('key').value, ...params }));
  const saveBlob = (data, name) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  $('load').onclick = async () => {
    const res = await api({});
    if (!res.ok) { $('list').textContent = 'Error ' + res.status + ' (wrong key, or RESULTS_KEY not set in Netlify).'; return; }
    const files = await res.json();
    $('list').innerHTML = '';
    if (!files.length) { $('list').textContent = 'No sessions stored yet.'; return; }
    for (const f of files) {
      const row = document.createElement('div');
      row.className = 'rowi';
      const name = document.createElement('span');
      name.textContent = f.file;
      const btn = document.createElement('button');
      btn.textContent = '⬇';
      btn.onclick = async () => {
        const r = await api({ file: f.file });
        if (r.ok) saveBlob(await r.json(), f.file);
      };
      row.append(name, btn);
      $('list').appendChild(row);
    }
  };
  $('all').onclick = async () => {
    const res = await api({ all: 1 });
    if (!res.ok) { $('list').textContent = 'Error ' + res.status + ' (wrong key, or RESULTS_KEY not set in Netlify).'; return; }
    saveBlob(await res.json(), 'ehmi-study-all-sessions.json');
  };
</script>
</body>
</html>
